name: Test, Build & Deploy to E1

on: 
  push:
    branches:
      - develop # Triggers on every push to develop (post-merge)

jobs:
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    env:
      TERM: xterm # enables colored and formatted output
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load Environments
        run: |
          export $(grep -v '^#' .env | xargs)
          echo "PORT: $PORT"

      - name: Setup Node.js v20.18.1
        uses: actions/setup-node@v4
        with: 
          node-version: v20.18.1
      
      - name: Install Dependencies
        run: npm i
      
      - name: Run Tests
        run: npm run test

      - name: Run Coverage
        run: npm run coverage

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push Docker image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fastify-app:${{ github.sha }}

  deploy: 
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deployment step
        run: echo "Deploying to E1...(Replace this with actual deployment)"