name: Build & Deploy to E1

on: 
  push:
    branches:
      - develop # Triggers when merging PRs into develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push Docker Image
        id: build_push
        uses: docker/build-push-action@v4
        with: 
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ github.repository }}-image
          outputs: type=digest
      
      - name: Save Docker Image SHA
        run: echo "IMAGE_SHA=${{ steps.build_push.outputs.digest }}" >> $GITHUB_ENV

      - name: Upload Image SHA
        uses: actions/upload-artifact@v4
        with:
          name: image-sha
          path: $GITHUB_ENV 

  deploy: 
    runs-on: ubuntu-latest
    needs: build

    steps:
